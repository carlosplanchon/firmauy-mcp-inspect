[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firmauy-mcp-inspect"
version = "0.7.0"
description = "Read-only MCP server that brings FirmaUY signature inspection to your AI assistant. Offline, no smart card, no signing, redacted by default."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Carlos A. Planchón", email = "carlosplanchon@cognitialabs.com" }
]
keywords = ["mcp", "model-context-protocol", "firmauy", "cedula", "uruguay", "signature", "verification", "inspection", "pades", "xades", "cades"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=2,<3",
]

# The `firmauy` CLI is a runtime requirement, run as a subprocess rather than imported (the process
# boundary is deliberate: see the README). It is an extra rather than a hard dependency, so you can
# install and pin the CLI yourself, or point at an existing one with FIRMAUY_BIN.
#   pip install "firmauy-mcp-inspect[cli]"
#   uv tool install firmauy-mcp-inspect --with firmauy
[project.optional-dependencies]
# Only the current CLI is supported, and older ones are refused rather than tolerated. This server
# hands firmauy's own JSON to the model and reports what firmauy concludes, so on older semantics it
# would be stating conclusions that were never reached: before 1.13.1 a timestamp's integrity,
# validity and trust were not consistently three separate answers, --tsa-ca was accepted on commands
# that ignored it, and a malformed token raised instead of coming back INDETERMINATE. Before 1.14.0
# two further kinds of damaged token raised inside pyHanko rather than producing a verdict.
#
# Enforced at runtime too (see _cli_version_error), because this bound only binds an install that
# pulls firmauy in as an extra, and the documented way to run this is a separate CLI or FIRMAUY_BIN.
#
# Raised past the semantic argument twice. First for security: twice firmauy has raised its own
# floor on a dependency to close a published advisory. 1.14.3 took cryptography from >=49.0.0 to
# >=50.0.0 (GHSA-g6cj-pr64-35w5), and 1.20.0 took urllib3 to >=2.8.0 (GHSA-8988-9cw3-xx77,
# GHSA-gh4c-6fx4-qh6g, GHSA-vxq7-64xx-v4gw). Anything older permits the affected versions. Then to
# 1.21.0 for Windows, the first release that runs there; on Linux it is 1.20.0 unchanged. This
# bound only helps the install that pulls firmauy in as an extra, which is why the runtime check
# carries the same number.
#
# Capped, unlike _MIN_FIRMAUY, which is deliberately open at the top so a local install can be
# ahead of the image's pin. The two are not the same decision. That floor governs a CLI somebody
# chose and can point FIRMAUY_BIN at; this one governs what a resolver is free to drag in behind
# their back, and a major it picks on its own is the one version nobody has looked at. The runtime
# contract check is what actually protects the answers either way, so this is the cheaper half of
# the same guard: it fails at install time, where a version problem costs nothing.
cli = ["firmauy>=1.21.0,<2"]

[project.scripts]
firmauy-mcp-inspect = "firmauy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Select the classic default ruleset explicitly (pyflakes + a pycodestyle subset) so linting stays
# deterministic across ruff releases. An unpinned `uvx ruff check` follows whatever defaults ruff
# ships that week: 0.16 widened its implicit default and turned a green CI into thousands of
# findings overnight.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The tests set up fixtures with compact one-liners (`f = tmp_path / "x"; f.write_text("y")`),
# which reads better here than doubling the line count of every case.
"tests/*" = ["E702"]
