[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firmauy-mcp-inspect"
version = "0.3.0"
description = "Read-only MCP server that brings FirmaUY signature inspection to your AI assistant. Offline, no smart card, no signing, redacted by default."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Carlos A. Planchón", email = "carlosplanchon@cognitialabs.com" }
]
keywords = ["mcp", "model-context-protocol", "firmauy", "cedula", "uruguay", "signature", "verification", "inspection", "pades", "xades", "cades"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=2,<3",
]

# The `firmauy` CLI is a runtime requirement, run as a subprocess rather than imported (the process
# boundary is deliberate: see the README). It is an extra rather than a hard dependency, so you can
# install and pin the CLI yourself, or point at an existing one with FIRMAUY_BIN.
#   pip install "firmauy-mcp-inspect[cli]"
#   uv tool install firmauy-mcp-inspect --with firmauy
[project.optional-dependencies]
# 1.9 is where each diagnostic check states whether its detail carries the cardholder's data, which
# is how this server decides what to withhold instead of guessing from the check's name.
cli = ["firmauy>=1.9"]

[project.scripts]
firmauy-mcp-inspect = "firmauy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Same explicit ruleset as firmauy, so linting does not drift with ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The tests set up fixtures with compact one-liners (`f = tmp_path / "x"; f.write_text("y")`),
# which reads better here than doubling the line count of every case.
"tests/*" = ["E702"]
