[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firmauy-mcp-inspect"
version = "0.3.0"
description = "Read-only MCP server that brings FirmaUY signature inspection to your AI assistant. Offline, no smart card, no signing, redacted by default."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Carlos A. Planchón", email = "carlosplanchon@cognitialabs.com" }
]
keywords = ["mcp", "model-context-protocol", "firmauy", "cedula", "uruguay", "signature", "verification", "inspection", "pades", "xades", "cades"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=2,<3",
]

# The `firmauy` CLI is a runtime requirement, run as a subprocess rather than imported (the process
# boundary is deliberate: see the README). It is an extra rather than a hard dependency, so you can
# install and pin the CLI yourself, or point at an existing one with FIRMAUY_BIN.
#   pip install "firmauy-mcp-inspect[cli]"
#   uv tool install firmauy-mcp-inspect --with firmauy
[project.optional-dependencies]
# 1.13.1 is the floor because of what this server reports about timestamps. Before it, a signature
# timestamp's integrity, validity and trust were not consistently three separate answers, --tsa-ca
# was accepted on commands that ignored it or applied it to XAdES only, and a malformed token raised
# instead of coming back INDETERMINATE. An inspection server must not announce timestamp trust on
# those semantics: it would be stating a conclusion the CLI underneath did not actually reach.
#
# 1.9 remains the floor for the other half of what this server does: it is where each diagnostic
# check states whether its detail carries the cardholder's data, which is how the doctor tool
# decides what to withhold instead of guessing from the check's name.
#
# Upper bound because 2.0 may move the JSON this server hands the model verbatim.
cli = ["firmauy>=1.13.1,<2"]

[project.scripts]
firmauy-mcp-inspect = "firmauy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Select the classic default ruleset explicitly (pyflakes + a pycodestyle subset) so linting stays
# deterministic across ruff releases. An unpinned `uvx ruff check` follows whatever defaults ruff
# ships that week: 0.16 widened its implicit default and turned a green CI into thousands of
# findings overnight.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The tests set up fixtures with compact one-liners (`f = tmp_path / "x"; f.write_text("y")`),
# which reads better here than doubling the line count of every case.
"tests/*" = ["E702"]
