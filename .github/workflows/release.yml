name: Publish

# Publishes to PyPI when a version tag (e.g. v0.1.1) is pushed. Uses PyPI
# Trusted Publishing (OIDC): no API token or secret is stored in the repo.
on:
  push:
    tags:
      - "v*"

# Third-party actions are pinned to a full commit SHA with the tag they carried beside it, which is
# what GitHub asks for: a tag is a name its owner can move, and moving it changes what runs here on
# the next push without anything in this file changing. The comment is what makes an upgrade
# reviewable, since a bare forty-character hash says nothing about what it is.
# `pypa/gh-action-pypi-publish@release/v1` was the loosest of the lot: a branch rather than a tag,
# so it changed under this workflow on every push its maintainers made to it. It is the step that
# holds an OIDC token good for uploading to PyPI under this project's name.

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # Catch the classic slip (tagging before committing the version bump) here, in seconds and
      # with a clear message, instead of at the upload with PyPI's "File already exists".
      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $pkg. Commit the version bump, then re-tag that commit."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The publisher registered on PyPI must match this environment name.
    environment:
      name: pypi
      url: https://pypi.org/project/firmauy-mcp-inspect/
    permissions:
      id-token: write        # mint the OIDC token PyPI verifies; no secrets needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
